[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Use the ESP32-S3's built-in USB Serial/JTAG interface for diagnostics.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USB_PRODUCT='"Logitech H-Shifter"'
    -D USB_MANUFACTURER='"Codex"'

upload_protocol = esptool
upload_port = COM31
monitor_port = COM32
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
